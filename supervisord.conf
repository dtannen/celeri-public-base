[supervisord]
nodaemon=true

[program:php-fpm]
command=/usr/local/sbin/celeri-php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

[program:redis]
command=/usr/bin/redis-server
autorestart=true

[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/app/artisan horizon
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/horizon.log

[program:highcharts]
command=/usr/bin/highcharts-export-server --loadConfig /etc/highcharts-export-server.json --enableServer 1
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/highcharts.log

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
