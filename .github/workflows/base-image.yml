name: Base image

on:
  push:
    branches: [main, 'codex/platform-upgrade-2026']
    paths:
      - Dockerfile
      - .dockerignore
      - .bash_aliases
      - homestead
      - fastcgi_params
      - supervisord.conf
      - 'fonts/**'
      - 'scripts/**'
      - .github/workflows/base-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .bash_aliases
      - homestead
      - fastcgi_params
      - supervisord.conf
      - 'fonts/**'
      - 'scripts/**'
      - .github/workflows/base-image.yml
  schedule:
    # Refresh OS/PHP packages weekly, then exercise the new base without publishing.
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested PHP 8.5 image to celeri/public-base
        type: boolean
        default: false
      refresh:
        description: Bypass cached install layers to refresh OS/PHP packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Push and manual runs for one branch share a publisher. Do not cancel a push
  # midway through publication; the helper also rejects superseded commits.
  group: base-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    name: base (8.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PHP_VERSION: '8.5'
      LOCAL_IMAGE: celeri/public-base:check-8.5
      # Run identifiers preserve distinct versions for security rebuilds of one commit.
      RELEASE_IMAGE: celeri/public-base:php8.5-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      USE_BUILD_CLOUD: ${{ github.repository == 'dtannen/celeri-public-base' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/platform-upgrade-2026') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check publication contract
        run: python3 scripts/test-publish-tested-base.py
      - name: Log in for trusted cloud builds
        if: github.event_name != 'pull_request' && env.USE_BUILD_CLOUD == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up trusted cloud builder
        if: github.event_name != 'pull_request' && env.USE_BUILD_CLOUD == 'true'
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.37.0
          driver: cloud
          endpoint: ${{ vars.DOCKER_BUILD_CLOUD_BUILDER }}
      - name: Set up isolated builder for pull requests
        if: github.event_name == 'pull_request' || env.USE_BUILD_CLOUD != 'true'
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.37.0
      - name: Capture current publication destination
        if: github.event_name != 'pull_request' && env.USE_BUILD_CLOUD == 'true' && vars.DOCKERHUB_PUBLISH_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/platform-upgrade-2026') || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
        env:
          DOCKERHUB_PUBLISH_ENABLED: ${{ vars.DOCKERHUB_PUBLISH_ENABLED }}
          PUBLISH_REQUESTED: ${{ inputs.publish == true }}
        run: python3 scripts/publish-tested-base.py --prepare
      - name: Build base
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: PHP_VERSION=${{ env.PHP_VERSION }}
          no-cache: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
          # Cloud builders retain their own cache. Untrusted runs use only the
          # isolated runner and its branch-scoped GitHub Actions cache.
          cache-from: ${{ (github.event_name == 'pull_request' || env.USE_BUILD_CLOUD != 'true') && 'type=gha,scope=base-8.5' || '' }}
          cache-to: ${{ (github.event_name == 'pull_request' || env.USE_BUILD_CLOUD != 'true') && 'type=gha,mode=max,scope=base-8.5' || '' }}
      - name: Record built image identity before tests
        run: |
          image_id=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'TESTED_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Check PHP, worker permissions, PDF and chart rendering offline
        run: |
          bash -n scripts/smoke-base.sh
          docker run --rm --platform linux/amd64 --network none \
            --volume "$PWD/scripts:/checks:ro" --entrypoint bash \
            "$LOCAL_IMAGE" /checks/smoke-base.sh
      - name: Check static asset caching and compression offline
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --volume "$PWD/scripts:/checks:ro" --entrypoint python3 \
            "$LOCAL_IMAGE" /checks/check-nginx-static-assets.py
      - name: Publish tested image
        # Disable Docker Hub's matching autobuild rule before enabling this.
        # Main's existing tag mapping is intentionally untouched.
        if: github.event_name != 'pull_request' && env.USE_BUILD_CLOUD == 'true' && vars.DOCKERHUB_PUBLISH_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/platform-upgrade-2026') || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
        env:
          DOCKERHUB_PUBLISH_ENABLED: ${{ vars.DOCKERHUB_PUBLISH_ENABLED }}
          PUBLISH_REQUESTED: ${{ inputs.publish == true }}
        run: python3 scripts/publish-tested-base.py
